# footnote 백엔드 nginx 설정. __PUBLIC_HOST__ 를 실제 도메인으로 바꿔 설치한다.
#   sed "s/__PUBLIC_HOST__/api.example.com/g" footnote.nginx.conf | sudo tee /etc/nginx/conf.d/footnote.conf
# 기존 사이트 설정은 건드리지 않고 그 도메인의 인증서만 같이 쓴다. 컨테이너는 127.0.0.1에만 열려 있다.
#
#   8443 → API       (127.0.0.1:8210)
#   8444 → S3 (SeaweedFS, presigned URL 전용) (127.0.0.1:8211)

server {
    listen 8443 ssl;
    server_name __PUBLIC_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PUBLIC_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # GPS 벌크 전송(gzip) 여유분
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8444 ssl;
    server_name __PUBLIC_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PUBLIC_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8211;
        proxy_http_version 1.1;
        # presigned 서명에 Host(포트 포함)가 들어간다. $host는 포트를 버리므로 $http_host를 넘긴다.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 사진을 nginx에 쌓지 않고 바로 흘려보낸다.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
