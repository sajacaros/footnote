name: footnote_walk
description: A map-first dog walking journal for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.9.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.1.0
  health: ^13.3.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  share_plus: ^13.3.0
  sqflite: ^2.4.4
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
